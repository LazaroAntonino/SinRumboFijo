<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Favicon Preview</title>
	<style>
		body {
			background: #fff;
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100vh;
			margin: 0;
		}
		.circle {
			background: #fff;
			border-radius: 50%;
			box-shadow: 0 0 16px rgba(0,0,0,0.08);
			width: 128px;
			height: 128px;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.circle img {
			width: 96px;
			height: 96px;
			border-radius: 50%;
			object-fit: cover;
			background: #fff;
		}
	</style>
</head>
<body>
	<div class="circle">
		<img src="./images/Logo2_Front.png" alt="Favicon" />
	</div>
</body>
</html>
